[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dotdoctor"
dynamic = ["version"]
description = "DotDoctor: Minimalist Linux system diagnostic and update utility"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "DotDoctor Contributors" }
]
keywords = ["archlinux", "system-update", "diagnostics", "maintenance", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.16.0,<1.0.0",
  "rich>=14.0.0,<17.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "PyYAML>=6.0.0,<7.0.0"
]

[project.urls]
Homepage = "https://github.com/m1tyarch/DotDoctor"
Repository = "https://github.com/m1tyarch/DotDoctor.git"
Issues = "https://github.com/m1tyarch/DotDoctor/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "black>=24.0.0,<25.0.0",
  "ruff>=0.6.0,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
  "types-PyYAML>=6.0.12",
  "bandit>=1.7.0"
]

[project.scripts]
dotdoctor = "dotdoctor.main:run"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
strict_optional = true

[tool.bandit]
targets = ["src"]
skips = ["B101", "B105", "B110", "B310", "B314", "B404", "B405", "B603", "B604", "B607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.version]
path = "src/dotdoctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dotdoctor"]
