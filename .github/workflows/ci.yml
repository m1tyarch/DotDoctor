name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' build

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests with coverage
        run: pytest --cov=src/dotdoctor --cov-report=term-missing --cov-fail-under=75

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify clean artifact installs
        run: python scripts/verify_distributions.py dist/*.whl dist/*.tar.gz
