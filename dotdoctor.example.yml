# DotDoctor Configuration
# Placed at $XDG_CONFIG_HOME/dotdoctor/config.yml or ~/.config/dotdoctor/config.yml

# List of check IDs to disable during scans:
#   sys.packages        - Pacman system packages
#   sys.aur             - AUR updates (yay / paru)
#   sys.flatpak         - Flatpak packages
#   sys.flatpak-unused  - Unused Flatpak runtimes
#   sys.firmware        - Firmware updates (fwupd)
#   sys.reboot          - Reboot required check
#   sys.disk            - Disk space check
#   sys.orphans         - Orphan packages
#   sys.cache           - Pacman cache size
#   sys.pacnew          - .pacnew configuration files
#   sys.services        - Failed systemd units
#   sys.journal         - Systemd journal size
disabled_checks: []
